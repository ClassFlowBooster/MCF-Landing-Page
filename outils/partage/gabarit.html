<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- trio.png : les trois castors de la carte d'accueil (dessin d'origine, qui n'existe pas en SVG), repris de l'ancienne carte.
     Gabarit des cartes de partage og:image (1200 × 630). Rendu par outils/partage/rendre.sh.
     Paramètres dans l'URL : page=classflow|ecoles|enseignants|parents-enfants -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--coral:#F0552B;--paper:#FBF8F3;--ink:#1F1A14;--ink-2:#4A4238;--line:#E6DFCF}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--paper);font-family:Inter,sans-serif;color:var(--ink)}
.halo{position:absolute;border-radius:50%;filter:blur(60px)}
.h1{left:720px;top:-60px;width:600px;height:420px;background:rgba(240,85,43,.13)}
.h2{left:-120px;top:-60px;width:360px;height:300px;background:rgba(240,85,43,.05)}
.brand{z-index:2;position:absolute;left:80px;top:78px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:29.8px}
.brand i{width:44px;height:44px;border-radius:12px;background:var(--coral)}
h1{z-index:2;position:absolute;left:76px;top:179px;margin:0;font:600 124px/1 Fraunces,serif;font-variation-settings:"opsz" 144;letter-spacing:0;white-space:nowrap}
p{z-index:2;position:absolute;left:80px;top:316px;width:580px;margin:0;font-size:38px;line-height:1.35;color:var(--ink-2);font-weight:500}
.tag{z-index:2;position:absolute;left:80px;top:499px;border:2px solid var(--line);background:rgba(255,255,255,.55);border-radius:99px;padding:9px 22px;font-weight:600;font-size:25.8px}
.b{position:absolute;filter:drop-shadow(0 14px 22px rgba(168,46,15,.22))}
</style></head><body>
<div class="halo h1"></div><div class="halo h2"></div>
<div class="brand"><i></i>myclassflow.fr</div>
<h1 id="nom">MyClassFlow</h1>
<p id="acc"></p><div class="tag" id="tag"></div>
<div id="castors"></div>
<script>
const PAGES = {
  "classflow": { acc:"Adaptez chaque support aux besoins de chaque élève, en quelques secondes.", tag:"Enseignants · Écoles · Familles", trio:true },
  "ecoles": { acc:"L'école inclusive, outillée pour toute l'équipe.", tag:"Espace Écoles", castors:[["direction",{x:690,y:70,h:520}]] },
  "enseignants": { acc:"Adaptez chaque support aux besoins de chaque élève, en un clic.", tag:"Espace Enseignants", castors:[["professeur",{x:690,y:70,h:520}]] },
  "parents-enfants": { acc:"Les devoirs de votre enfant, adaptés en une photo.", tag:"Espace Parents / Enfants", castors:[["eleve",{x:690,y:70,h:520}]] }
};
const p = PAGES[new URLSearchParams(location.search).get("page")];
nom.textContent = new URLSearchParams(location.search).get("nom") || "MyClassFlow"; acc.textContent = p.acc; tag.textContent = p.tag;
castors.innerHTML = p.trio ? `<img src="trio.png" style="position:absolute;left:560px;top:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 90px)">` : p.castors.map(([n,c]) => `<img class="b" src="../../assets/img/castors/${n}.svg" style="left:${c.x}px;top:${c.y}px;height:${c.h}px">`).join("");
</script></body></html>
